name: Release-plz

on:
  push:
    branches:
      - main

# `release` and `release-pr` are independent, parallel jobs: `release`
# publishes any version already merged to main, while `release-pr`
# prepares the PR for the next one. Neither depends on the other's
# outcome. Serialised on the branch so two pushes can't race the tag or
# the PR update.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release-plz
    if: ${{ github.repository_owner == 'mathiasesn' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      # Anchors below (&checkout, &toolchain, &cache) are referenced by the
      # release-pr job so the two jobs cannot drift on the toolchain or the
      # cache key. Cross-job YAML anchors/aliases are a recently-shipped
      # GitHub Actions feature (actions/runner#1182, closed 2025-08-04) — do
      # not "fix" this back into duplicated steps.
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `rustup show` honours rust-toolchain.toml, so releases build with the
      # same toolchain CI tested against. Do not swap this for a pinned
      # `dtolnay/rust-toolchain@stable`.
      - &toolchain
        name: Install Rust toolchain
        run: rustup show

      - &cache
        name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Fallback is load-bearing here specifically: merging a release PR
          # always changes Cargo.lock (release-plz writes the version
          # bumps), so without restore-keys the one run that pays for four
          # `cargo publish --verify` builds is guaranteed a cold cache.
          restore-keys: ${{ runner.os }}-cargo-

      # `cargo publish` verifies each crate with a full build; without the
      # cache above every push to main pays a cold workspace compile.
      #
      # dry_run is deliberate, not leftover scaffolding. No adept crate exists
      # on crates.io yet and `[workspace.package].version` is already 0.1.0, so
      # `release` — which publishes any manifest version absent from the
      # registry, regardless of tags or release PRs — would claim all four
      # names on the very first push to main. Publishing is a one-way door:
      # crates.io yanks, it never deletes. Keep this true until the log from a
      # real run shows the expected four crates in dependency order, then
      # delete the `dry_run` line entirely — do NOT set it to `false`.
      # `release-plz/action@v0.5.131` `action.yml:115-118` guards the flag on
      # string emptiness (`if [[ -n "${{ inputs.dry_run }}" ]]`) and the input
      # has no `default:` (`action.yml:39`), so `dry_run: false` still renders
      # as the non-empty string "false" and `--dry-run` is still passed.
      - name: Release unpublished versions
        uses: release-plz/action@v0.5.131
        with:
          command: release
          dry_run: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-pr:
    name: Release-plz PR
    if: ${{ github.repository_owner == 'mathiasesn' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - *checkout
      - *toolchain
      - *cache

      # RELEASE_PLZ_TOKEN is required, not optional: GitHub never fires
      # workflow triggers for events caused by the default GITHUB_TOKEN (loop
      # prevention), so a release PR opened with it arrives with zero CI
      # checks — and that PR is the one whose merge publishes to crates.io.
      # A fine-grained PAT with contents:write + pull_requests:write makes CI
      # run on it normally, so it must be configured; there is no fallback.
      #
      # Ordering hazard: the jobs run in parallel now, not in sequence — a
      # missing PAT still does not fail fast, because the release job above
      # succeeds independently on the plain GITHUB_TOKEN. The first push to
      # main can still publish all four crates irreversibly while this job
      # goes red separately for lacking the PAT.
      #
      # No CARGO_REGISTRY_TOKEN here: opening the release PR only reads the
      # public registry index, so the publish-capable secret stays scoped to
      # the release job that actually publishes.
      - name: Open or update the release PR
        uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
