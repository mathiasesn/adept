name: Release-plz

on:
  push:
    branches:
      - main

# Both release-plz commands run in one job, in order: `release` publishes any
# version already merged to main, then `release-pr` opens/updates the PR for
# the next one. Serialised on the branch so two pushes can't race the tag or
# the PR update.
concurrency:
  group: release-plz-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-plz:
    name: Release-plz
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # `rustup show` honours rust-toolchain.toml, so releases build with the
      # same toolchain CI tested against. Do not swap this for a pinned
      # `dtolnay/rust-toolchain@stable`.
      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # `cargo publish` verifies each crate with a full build; without the
      # cache above every push to main pays a cold workspace compile.
      - name: Release unpublished versions
        uses: release-plz/action@v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # RELEASE_PLZ_TOKEN is required, not optional: GitHub never fires
      # workflow triggers for events caused by the default GITHUB_TOKEN (loop
      # prevention), so a release PR opened with it arrives with zero CI
      # checks — and that PR is the one whose merge publishes to crates.io.
      # A fine-grained PAT with contents:write + pull_requests:write makes CI
      # run on it normally, so it must be configured; there is no fallback.
      #
      # Ordering hazard: the `release` step above runs first and succeeds
      # with the plain GITHUB_TOKEN, so a missing PAT doesn't fail fast —
      # the first push to main publishes all four crates irreversibly, and
      # only this step goes red afterward.
      #
      # No CARGO_REGISTRY_TOKEN here: opening the release PR only reads the
      # public registry index, so the publish-capable secret stays scoped to
      # the step that actually publishes.
      - name: Open or update the release PR
        uses: release-plz/action@v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
