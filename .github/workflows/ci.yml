name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    name: build, test, clippy, fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Same fallback as release.yml: a Cargo.lock change should degrade
          # to a warm cache, not a cold one.
          restore-keys: ${{ runner.os }}-cargo-

      - name: cargo build
        run: cargo build --workspace --all-targets

      - name: cargo test
        run: cargo test --workspace

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: Performance smoke test (lint 100 skills)
        # Acceptance criterion (docs/MVP.md): `check` lints 100
        # skills in under 1 second on a typical dev machine. Measured
        # performance is ~23ms; a 500ms threshold catches an
        # order-of-magnitude regression without being flaky on noisy CI
        # runners (criterion `--quick` keeps this cheap).
        run: |
          set -euo pipefail
          output="$(cargo bench -p adept-core --bench lint_100_skills -- --quick 2>&1)"
          echo "$output"
          # Extract the middle (point-estimate) value from a criterion line like:
          #   lint_100_skills   time:   [22.095 ms 23.102 ms 23.354 ms]
          line="$(echo "$output" | grep -E '^lint_100_skills\s+time:' || true)"
          if [ -z "$line" ]; then
            echo "::error::could not find criterion timing output for lint_100_skills"
            exit 1
          fi
          read -r value unit <<< "$(echo "$line" | sed -E 's/^lint_100_skills\s+time:\s+\[[0-9.]+ [a-z]+ ([0-9.]+) ([a-z]+) .*/\1 \2/')"
          case "$unit" in
            ns) ms=$(awk "BEGIN { print $value / 1000000 }") ;;
            us) ms=$(awk "BEGIN { print $value / 1000 }") ;;
            ms) ms="$value" ;;
            s) ms=$(awk "BEGIN { print $value * 1000 }") ;;
            *) echo "::error::unrecognized unit in criterion output: $unit"; exit 1 ;;
          esac
          echo "lint_100_skills point estimate: ${ms} ms"
          over_threshold=$(awk "BEGIN { print ($ms > 500) ? 1 : 0 }")
          if [ "$over_threshold" -eq 1 ]; then
            echo "::error::lint_100_skills took ${ms}ms, exceeding the 500ms regression threshold (target: under 1000ms; typical: ~23ms)"
            exit 1
          fi

  python-packaging:
    name: python packaging (maturin, ubuntu-only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          # Same fallback as release.yml: a Cargo.lock change should degrade
          # to a warm cache, not a cold one.
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build and install adept from the checkout
        run: |
          set -euo pipefail
          uv venv .venv
          uv pip install --python .venv/bin/python .

      - name: Verify installed CLI matches the workspace version
        run: |
          set -euo pipefail
          source .venv/bin/activate

          workspace_version="$(sed -n '/^\[workspace.package\]/,/^\[/{/^version *= */{s/^version *= *"\([^"]*\)".*/\1/p}}' Cargo.toml | head -n1)"
          if [ -z "$workspace_version" ]; then
            echo "::error::could not parse [workspace.package].version from Cargo.toml"
            exit 1
          fi
          echo "workspace version: $workspace_version"

          bin_output="$(adept --version)"
          module_output="$(python -m adept --version)"
          echo "adept --version: $bin_output"
          echo "python -m adept --version: $module_output"

          if [ "$bin_output" != "$module_output" ]; then
            echo "::error::'adept --version' ($bin_output) and 'python -m adept --version' ($module_output) disagree"
            exit 1
          fi

          case "$bin_output" in
            *"$workspace_version"*) ;;
            *)
              echo "::error::reported version '$bin_output' does not contain workspace version '$workspace_version'"
              exit 1
              ;;
          esac
