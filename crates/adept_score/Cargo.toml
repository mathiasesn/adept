[package]
name = "adept_score"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "LLM-assisted scoring (triggering accuracy, overlap detection) for Agent Skills. Owned by the scorer agent."

[dependencies]
adept = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
reqwest = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
tracing = { workspace = true }
jiff = { workspace = true }

[dev-dependencies]
insta = { workspace = true, features = ["json"] }
tempfile = { workspace = true }
# Dev-only: the library dependency rule ("tracing-subscriber belongs to
# adept_cli, libraries emit but never subscribe") is about what ships. A
# dev-dependency is not linked into the library, so this cannot pull a
# subscriber into a downstream build; it exists so the secret-redaction
# tests can assert against real emitted tracing output rather than a proxy.
tracing-subscriber = { workspace = true }
