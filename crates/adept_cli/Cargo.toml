[package]
name = "adept_cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "CLI binary (`adept`) for linting, formatting, and scoring Agent Skills. Owned by the CLI agent."

[[bin]]
name = "adept"
path = "src/main.rs"

[dependencies]
adept = { workspace = true }
adept_fmt = { workspace = true }
adept_score = { workspace = true }
adept_agent = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = "0.8"
tokio = { workspace = true }
anyhow = { workspace = true }
owo-colors = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustyline = { workspace = true }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
