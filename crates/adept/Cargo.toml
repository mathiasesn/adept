[package]
name = "adept-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme.workspace = true
description = "Core data model, parser, and diagnostics for adept, a linter/formatter/scorer for Agent Skills."
# Vendored third-party skill corpus (~1.8MB) used only by local tests; keep it
# out of the published crate so it isn't downloaded by every dependent.
exclude = ["tests/fixtures/corpus/"]

[lib]
name = "adept"

[dependencies]
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
pulldown-cmark = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
tiktoken-rs = { workspace = true }
owo-colors = { workspace = true }

[dev-dependencies]
insta = { workspace = true }
criterion = "0.5"
tempfile = { workspace = true }

[[bench]]
name = "lint_100_skills"
harness = false
