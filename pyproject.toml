[build-system]
requires = ["maturin>=1.9,<2", "patchelf; sys_platform == 'linux'"]
build-backend = "maturin"

[project]
name = "adept"
description = "Linter, formatter, and LLM-assisted authoring tool for agent skills (SKILL.md)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
dynamic = ["version"]
keywords = ["agent", "skills", "linter", "formatter", "llm"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]

[project.urls]
Repository = "https://github.com/mathiasesn/adept"

[tool.maturin]
bindings = "bin"
manifest-path = "crates/adept_cli/Cargo.toml"
python-source = "python"
strip = true
exclude = [
    "crates/adept/tests/**",
    "crates/adept_fmt/tests/**",
    "crates/adept_agent/tests/**",
    "crates/adept_cli/tests/**",
    "**/*.snap",
    "**/snapshots/**",
]
